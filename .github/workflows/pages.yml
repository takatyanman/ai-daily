name: Publish daily articles and RSS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/configure-pages@v5
        id: pages
      - run: node scripts/build.test.mjs
      - run: node scripts/build.mjs
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
      - run: node scripts/rasterize.mjs
      - run: python3 scripts/check_feed.py dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
